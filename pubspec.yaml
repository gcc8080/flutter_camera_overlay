name: flutter_camera_overlay
description: A Flutter package for capturing documents with customizable camera overlays.
version: 0.2.0
homepage: https://github.com/gcc8080/flutter_camera_overlay
repository: https://github.com/gcc8080/flutter_camera_overlay

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  camera: 0.11.2
  # Keep the Android implementation on the newest CameraX release that supports
  # Flutter 3.27. This avoids the Camera2 capture-session shutdown race.
  camera_android_camerax: 0.6.17
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^1.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
